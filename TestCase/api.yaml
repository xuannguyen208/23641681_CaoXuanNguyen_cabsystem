openapi: 3.0.3

info:
  title: JAM / CAB Ride Booking API
  version: 1.0.0
  description: |
    Đặc tả API cho hệ thống đặt xe JAM/CAB.
    API được xây dựng theo các chức năng trong tài liệu:
    quản lý người dùng, khách hàng, tài xế, phương tiện, đặt xe,
    tìm và phân công tài xế, quản lý chuyến, định vị, tính cước,
    thanh toán, thông báo, đánh giá, vận hành và báo cáo.

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development

tags:
  - name: Authentication
    description: FR01 - Đăng ký, đăng nhập, đăng xuất, xác thực
  - name: Customer
    description: FR02 - Quản lý khách hàng
  - name: Driver
    description: FR03 - Quản lý tài xế
  - name: Vehicle
    description: FR04 - Quản lý phương tiện
  - name: Booking
    description: FR05 - Đặt xe
  - name: Driver Search
    description: FR06 - Tìm tài xế
  - name: Assignment
    description: FR07 - Phân công tài xế
  - name: Trip
    description: FR08 - Quản lý và theo dõi chuyến đi
  - name: Location
    description: FR09 - Theo dõi vị trí tài xế
  - name: Fare
    description: FR10 - Tính cước
  - name: Payment
    description: FR11-FR12-FR19 - Thanh toán và tích hợp nhà cung cấp
  - name: Notification
    description: FR13-FR20 - Thông báo
  - name: Review
    description: FR14 - Đánh giá tài xế
  - name: Operation
    description: FR15-FR16 - Vận hành và xử lý sự cố
  - name: Report
    description: FR17 - Báo cáo
  - name: Authorization
    description: FR18 - Phân quyền

security:
  - bearerAuth: []

paths:

  # ==========================================================
  # FR01 - AUTHENTICATION
  # ==========================================================

  /auth/register:
    post:
      tags: [Authentication]
      summary: Đăng ký tài khoản
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Tài khoản đã tồn tại

  /auth/login:
    post:
      tags: [Authentication]
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Sai tài khoản hoặc mật khẩu
        '403':
          description: Tài khoản không hoạt động

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Đăng xuất
      responses:
        '200':
          description: Đăng xuất thành công

  # ==========================================================
  # FR02 - CUSTOMER
  # ==========================================================

  /customers/me:
    get:
      tags: [Customer]
      summary: Xem thông tin cá nhân
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      tags: [Customer]
      summary: Cập nhật thông tin cá nhân
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /customers:
    get:
      tags: [Customer]
      summary: Danh sách khách hàng
      description: Nhân viên vận hành hoặc ban giám đốc tra cứu khách hàng.
      responses:
        '200':
          description: Danh sách khách hàng
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'

  /customers/{customer_id}:
    get:
      tags: [Customer]
      summary: Xem thông tin khách hàng
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/me/trips:
    get:
      tags: [Customer]
      summary: Xem lịch sử chuyến đi
      responses:
        '200':
          description: Danh sách lịch sử chuyến
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  # ==========================================================
  # FR03 - DRIVER
  # ==========================================================

  /drivers:
    get:
      tags: [Driver]
      summary: Danh sách tài xế
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [available, busy, offline]
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'

  /drivers/{driver_id}:
    get:
      tags: [Driver]
      summary: Xem thông tin tài xế
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Thông tin tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Driver]
      summary: Cập nhật thông tin tài xế
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

  /drivers/{driver_id}/status:
    put:
      tags: [Driver]
      summary: Cập nhật trạng thái tài xế
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

  # ==========================================================
  # FR04 - VEHICLE
  # ==========================================================

  /vehicles:
    get:
      tags: [Vehicle]
      summary: Xem danh sách phương tiện
      responses:
        '200':
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'

    post:
      tags: [Vehicle]
      summary: Thêm phương tiện
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Thêm phương tiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

  /vehicles/{vehicle_id}:
    put:
      tags: [Vehicle]
      summary: Cập nhật phương tiện
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

  # ==========================================================
  # FR05 - BOOKING
  # ==========================================================

  /bookings:
    post:
      tags: [Booking]
      summary: Đặt xe
      description: Khách hàng tạo yêu cầu với điểm đón, điểm đến và loại xe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags: [Booking]
      summary: Tra cứu danh sách chuyến
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - booking
              - searching_driver
              - driver_assigned
              - arriving_pickup
              - arrived_pickup
              - picked_up
              - in_progress
              - completed
              - cancelled
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  /bookings/{booking_id}:
    get:
      tags: [Booking]
      summary: Xem thông tin chuyến
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Thông tin chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{booking_id}/cancel:
    post:
      tags: [Booking]
      summary: Hủy yêu cầu đặt xe
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Hủy chuyến thành công
        '400':
          description: Không thể hủy chuyến

  # ==========================================================
  # FR06 - DRIVER SEARCH
  # ==========================================================

  /drivers/search:
    get:
      tags: [Driver Search]
      summary: Tìm tài xế phù hợp
      parameters:
        - in: query
          name: pickup_lat
          required: true
          schema:
            type: number
            format: double
        - in: query
          name: pickup_lng
          required: true
          schema:
            type: number
            format: double
        - in: query
          name: vehicle_type
          required: true
          schema:
            $ref: '#/components/schemas/VehicleType'
      responses:
        '200':
          description: Danh sách tài xế phù hợp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '404':
          description: Không tìm thấy tài xế phù hợp

  # ==========================================================
  # FR07 - ASSIGNMENT
  # ==========================================================

  /bookings/{booking_id}/assign:
    post:
      tags: [Assignment]
      summary: Phân công tài xế
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver_id]
              properties:
                driver_id:
                  type: integer
                  example: 101
      responses:
        '200':
          description: Phân công thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Tài xế không phù hợp hoặc đang bận

  /bookings/{booking_id}/accept:
    post:
      tags: [Assignment]
      summary: Tài xế nhận chuyến
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Nhận chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

  /bookings/{booking_id}/reject:
    post:
      tags: [Assignment]
      summary: Tài xế từ chối chuyến
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Từ chối thành công và hệ thống có thể tìm tài xế khác

  # ==========================================================
  # FR08 - TRIP
  # ==========================================================

  /bookings/{booking_id}/status:
    put:
      tags: [Trip]
      summary: Cập nhật trạng thái chuyến
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Trạng thái không hợp lệ

  /bookings/{booking_id}/tracking:
    get:
      tags: [Trip]
      summary: Theo dõi chuyến đi
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Trạng thái, tài xế, vị trí và thời gian dự kiến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripTracking'

  # ==========================================================
  # FR09 - LOCATION
  # ==========================================================

  /drivers/{driver_id}/location:
    put:
      tags: [Location]
      summary: Cập nhật vị trí tài xế
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Cập nhật vị trí thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'

  # ==========================================================
  # FR10 - FARE
  # ==========================================================

  /bookings/{booking_id}/fare:
    get:
      tags: [Fare]
      summary: Tính và xem cước chuyến đi
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Số tiền cần thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'

  # ==========================================================
  # FR11, FR12, FR19 - PAYMENT
  # ==========================================================

  /payments:
    post:
      tags: [Payment]
      summary: Thanh toán chuyến đi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Giao dịch được ghi nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Chuyến đã được thanh toán

  /payments/{payment_id}:
    get:
      tags: [Payment]
      summary: Tra cứu giao dịch
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Thông tin giao dịch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'

  /transactions:
    get:
      tags: [Payment]
      summary: Tra cứu lịch sử giao dịch
      responses:
        '200':
          description: Danh sách giao dịch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'

  /payment-provider/callback:
    post:
      tags: [Payment]
      summary: Nhận kết quả từ nhà cung cấp thanh toán
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCallback'
      responses:
        '200':
          description: Đã nhận kết quả thanh toán
        '404':
          description: Không tìm thấy giao dịch

  # ==========================================================
  # FR13, FR20 - NOTIFICATION
  # ==========================================================

  /notifications:
    post:
      tags: [Notification]
      summary: Gửi thông báo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '201':
          description: Gửi thông báo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

  /notifications/me:
    get:
      tags: [Notification]
      summary: Xem thông báo của người dùng
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

  # ==========================================================
  # FR14 - REVIEW
  # ==========================================================

  /reviews:
    post:
      tags: [Review]
      summary: Đánh giá tài xế
      description: Chỉ cho phép đánh giá khi chuyến đã hoàn thành.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Điểm đánh giá không hợp lệ hoặc chuyến chưa hoàn thành
        '409':
          description: Chuyến đã được đánh giá

  /drivers/{driver_id}/reviews:
    get:
      tags: [Review]
      summary: Xem đánh giá tài xế
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Danh sách đánh giá
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'

  # ==========================================================
  # FR15, FR16 - OPERATION
  # ==========================================================

  /operations/trips:
    get:
      tags: [Operation]
      summary: Quản lý chuyến đi
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'

  /operations/trips/{booking_id}:
    get:
      tags: [Operation]
      summary: Xem chi tiết chuyến cần xử lý
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Chi tiết chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

  /operations/trips/{booking_id}/incidents:
    post:
      tags: [Operation]
      summary: Ghi nhận chuyến bị lỗi
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentRequest'
      responses:
        '201':
          description: Ghi nhận sự cố thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /operations/incidents/{incident_id}:
    put:
      tags: [Operation]
      summary: Cập nhật kết quả xử lý sự cố
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentUpdateRequest'
      responses:
        '200':
          description: Cập nhật sự cố thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  # ==========================================================
  # FR17 - REPORT
  # ==========================================================

  /reports:
    get:
      tags: [Report]
      summary: Xem báo cáo tổng hợp
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Báo cáo tổng hợp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummary'

  /reports/trips:
    get:
      tags: [Report]
      summary: Báo cáo số lượng chuyến
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Báo cáo chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripReport'

  /reports/revenue:
    get:
      tags: [Report]
      summary: Báo cáo doanh thu
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Báo cáo doanh thu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueReport'

components:

  # ==========================================================
  # SECURITY
  # ==========================================================

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập token dạng Bearer <token>.

  # ==========================================================
  # PARAMETERS
  # ==========================================================

  parameters:

    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        type: integer
        example: 1

    DriverId:
      name: driver_id
      in: path
      required: true
      schema:
        type: integer
        example: 101

    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema:
        type: integer
        example: 201

    BookingId:
      name: booking_id
      in: path
      required: true
      schema:
        type: integer
        example: 10001

    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: integer
        example: 50001

    IncidentId:
      name: incident_id
      in: path
      required: true
      schema:
        type: integer
        example: 70001

    FromDate:
      name: from_date
      in: query
      schema:
        type: string
        format: date
        example: '2026-09-01'

    ToDate:
      name: to_date
      in: query
      schema:
        type: string
        format: date
        example: '2026-09-30'

  # ==========================================================
  # COMMON RESPONSES
  # ==========================================================

  responses:

    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Không có quyền thực hiện
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================
  # SCHEMAS
  # ==========================================================

  schemas:

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ.

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: nguyenvana
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: '0901234567'
        email:
          type: string
          format: email
          example: a@gmail.com
        role:
          type: string
          enum: [customer, driver, operator, manager]
          example: customer
        status:
          type: string
          enum: [active, inactive]
          example: active

    RegisterRequest:
      type: object
      required: [username, password, full_name, phone]
      properties:
        username:
          type: string
          example: nguyenvana
        password:
          type: string
          format: password
          example: '123456'
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: '0901234567'
        email:
          type: string
          format: email
          example: a@gmail.com
        role:
          type: string
          enum: [customer, driver]
          default: customer

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: nguyenvana
        password:
          type: string
          format: password
          example: '123456'

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    ProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: '0901234567'
        email:
          type: string
          format: email
          example: a@gmail.com

    Driver:
      type: object
      properties:
        id:
          type: integer
          example: 101
        user_id:
          type: integer
          example: 101
        full_name:
          type: string
          example: Trần Văn B
        phone:
          type: string
          example: '0912345678'
        status:
          type: string
          enum: [available, busy, offline]
          example: available
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
          example: 51A-12345
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          example: 4.8
        latitude:
          type: number
          format: double
          nullable: true
          example: 10.8557
        longitude:
          type: number
          format: double
          nullable: true
          example: 106.764

    DriverUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
        phone:
          type: string
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string

    DriverStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [available, busy, offline]

    Vehicle:
      type: object
      properties:
        id:
          type: integer
          example: 201
        driver_id:
          type: integer
          example: 101
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
          example: 51A-12345
        status:
          type: string
          enum: [active, inactive]
          example: active

    VehicleRequest:
      type: object
      required: [driver_id, vehicle_type, license_plate]
      properties:
        driver_id:
          type: integer
          example: 101
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
          example: 51A-12345

    VehicleType:
      type: string
      enum: [motorcycle, car]
      example: car

    BookingCreateRequest:
      type: object
      required:
        - pickup_address
        - destination_address
        - vehicle_type
      properties:
        pickup_address:
          type: string
          example: Đại học Công nghiệp TP.HCM
        destination_address:
          type: string
          example: Sân bay Tân Sơn Nhất
        pickup_lat:
          type: number
          format: double
          example: 10.8557
        pickup_lng:
          type: number
          format: double
          example: 106.764
        destination_lat:
          type: number
          format: double
          example: 10.8188
        destination_lng:
          type: number
          format: double
          example: 106.6519
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'

    Booking:
      type: object
      properties:
        id:
          type: integer
          example: 10001
        customer_id:
          type: integer
          example: 1
        driver_id:
          type: integer
          nullable: true
          example: 101
        pickup_address:
          type: string
        destination_address:
          type: string
        pickup_lat:
          type: number
          nullable: true
        pickup_lng:
          type: number
          nullable: true
        destination_lat:
          type: number
          nullable: true
        destination_lng:
          type: number
          nullable: true
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        status:
          $ref: '#/components/schemas/TripStatus'
        fare:
          type: number
          nullable: true
          example: 85000
        created_at:
          type: string
          format: date-time

    TripStatus:
      type: string
      enum:
        - booking
        - searching_driver
        - driver_assigned
        - arriving_pickup
        - arrived_pickup
        - picked_up
        - in_progress
        - completed
        - cancelled

    TripStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TripStatus'

    TripTracking:
      type: object
      properties:
        booking_id:
          type: integer
          example: 10001
        status:
          $ref: '#/components/schemas/TripStatus'
        driver:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Driver'
        location:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Location'
        eta_minutes:
          type: integer
          nullable: true
          example: 8

    Location:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 10.8557
        longitude:
          type: number
          format: double
          example: 106.764
        updated_at:
          type: string
          format: date-time

    LocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          example: 10.8557
        longitude:
          type: number
          format: double
          example: 106.764

    Fare:
      type: object
      properties:
        booking_id:
          type: integer
          example: 10001
        amount:
          type: number
          example: 85000
        currency:
          type: string
          example: VND

    PaymentRequest:
      type: object
      required: [booking_id, payment_method]
      properties:
        booking_id:
          type: integer
          example: 10001
        payment_method:
          type: string
          enum: [cash, electronic]
          example: electronic

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 50001
        booking_id:
          type: integer
          example: 10001
        amount:
          type: number
          example: 85000
        payment_method:
          type: string
          enum: [cash, electronic]
        status:
          type: string
          enum: [pending, paid, failed]
          example: paid
        transaction_code:
          type: string
          nullable: true
          example: TXN1750000000000
        created_at:
          type: string
          format: date-time

    PaymentCallback:
      type: object
      required: [payment_id, status]
      properties:
        payment_id:
          type: integer
          example: 50001
        status:
          type: string
          enum: [paid, failed]
          example: paid
        transaction_code:
          type: string
          example: TXN123456

    NotificationRequest:
      type: object
      required: [recipient_id, event, message]
      properties:
        recipient_id:
          type: integer
          example: 1
        event:
          type: string
          example: driver_assigned
        message:
          type: string
          example: Tài xế Trần Văn B đã nhận chuyến của bạn.
        channel:
          type: string
          enum: [push, sms, email]
          default: push

    Notification:
      type: object
      properties:
        id:
          type: integer
          example: 80001
        recipient_id:
          type: integer
        event:
          type: string
        message:
          type: string
        channel:
          type: string
        status:
          type: string
          enum: [sent, failed]
        created_at:
          type: string
          format: date-time

    ReviewRequest:
      type: object
      required: [booking_id, rating]
      properties:
        booking_id:
          type: integer
          example: 10001
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: Tài xế phục vụ tốt.

    Review:
      allOf:
        - $ref: '#/components/schemas/ReviewRequest'
        - type: object
          properties:
            id:
              type: integer
              example: 90001
            customer_id:
              type: integer
              example: 1
            driver_id:
              type: integer
              example: 101
            created_at:
              type: string
              format: date-time

    IncidentRequest:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
          example: driver_no_response
        description:
          type: string
          example: Tài xế không phản hồi yêu cầu chuyến.

    IncidentUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [open, processing, resolved]
        result:
          type: string
          example: Đã phân công tài xế khác.

    Incident:
      allOf:
        - $ref: '#/components/schemas/IncidentRequest'
        - type: object
          properties:
            id:
              type: integer
              example: 70001
            booking_id:
              type: integer
              example: 10001
            status:
              type: string
              enum: [open, processing, resolved]
            created_by:
              type: integer
              example: 900
            created_at:
              type: string
              format: date-time

    ReportSummary:
      type: object
      properties:
        total_trips:
          type: integer
          example: 1200
        completed_trips:
          type: integer
          example: 1080
        cancelled_trips:
          type: integer
          example: 120
        completion_rate:
          type: number
          example: 90
        cancellation_rate:
          type: number
          example: 10
        total_revenue:
          type: number
          example: 102000000
        currency:
          type: string
          example: VND

    TripReport:
      type: object
      properties:
        total_trips:
          type: integer
        completed_trips:
          type: integer
        cancelled_trips:
          type: integer
        completion_rate:
          type: number
        cancellation_rate:
          type: number

    RevenueReport:
      type: object
      properties:
        total_revenue:
          type: number
          example: 102000000
        currency:
          type: string
          example: VND

openapi: 3.0.3
info:
  title: JAM / CAB - Authentication API
  version: 1.0.0
  description: 'Đặc tả API cho hệ thống đặt xe JAM/CAB.

    API được xây dựng theo các chức năng trong tài liệu:

    quản lý người dùng, khách hàng, tài xế, phương tiện, đặt xe,

    tìm và phân công tài xế, quản lý chuyến, định vị, tính cước,

    thanh toán, thông báo, đánh giá, vận hành và báo cáo.

    '
servers:
- url: http://localhost:8080/api/v1
  description: Local Development
tags:
- name: Authentication
  description: FR01 - Đăng ký, đăng nhập, đăng xuất, xác thực
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Đăng ký tài khoản
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Tài khoản đã tồn tại
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Sai tài khoản hoặc mật khẩu
        '403':
          description: Tài khoản không hoạt động
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Đăng xuất
      responses:
        '200':
          description: Đăng xuất thành công
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập token dạng Bearer <token>.
  parameters:
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        type: integer
        example: 1
    DriverId:
      name: driver_id
      in: path
      required: true
      schema:
        type: integer
        example: 101
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema:
        type: integer
        example: 201
    BookingId:
      name: booking_id
      in: path
      required: true
      schema:
        type: integer
        example: 10001
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: integer
        example: 50001
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema:
        type: integer
        example: 70001
    FromDate:
      name: from_date
      in: query
      schema:
        type: string
        format: date
        example: '2026-09-01'
    ToDate:
      name: to_date
      in: query
      schema:
        type: string
        format: date
        example: '2026-09-30'
  responses:
    BadRequest:
      description: Dữ liệu yêu cầu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không có quyền thực hiện
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ.
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: nguyenvana
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: 0901234567
        email:
          type: string
          format: email
          example: a@gmail.com
        role:
          type: string
          enum:
          - customer
          - driver
          - operator
          - manager
          example: customer
        status:
          type: string
          enum:
          - active
          - inactive
          example: active
    RegisterRequest:
      type: object
      required:
      - username
      - password
      - full_name
      - phone
      properties:
        username:
          type: string
          example: nguyenvana
        password:
          type: string
          format: password
          example: '123456'
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: 0901234567
        email:
          type: string
          format: email
          example: a@gmail.com
        role:
          type: string
          enum:
          - customer
          - driver
          default: customer
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: nguyenvana
        password:
          type: string
          format: password
          example: '123456'
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'
    ProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: 0901234567
        email:
          type: string
          format: email
          example: a@gmail.com
    Driver:
      type: object
      properties:
        id:
          type: integer
          example: 101
        user_id:
          type: integer
          example: 101
        full_name:
          type: string
          example: Trần Văn B
        phone:
          type: string
          example: 0912345678
        status:
          type: string
          enum:
          - available
          - busy
          - offline
          example: available
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
          example: 51A-12345
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          example: 4.8
        latitude:
          type: number
          format: double
          nullable: true
          example: 10.8557
        longitude:
          type: number
          format: double
          nullable: true
          example: 106.764
    DriverUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
        phone:
          type: string
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
    DriverStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - available
          - busy
          - offline
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          example: 201
        driver_id:
          type: integer
          example: 101
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
          example: 51A-12345
        status:
          type: string
          enum:
          - active
          - inactive
          example: active
    VehicleRequest:
      type: object
      required:
      - driver_id
      - vehicle_type
      - license_plate
      properties:
        driver_id:
          type: integer
          example: 101
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        license_plate:
          type: string
          example: 51A-12345
    VehicleType:
      type: string
      enum:
      - motorcycle
      - car
      example: car
    BookingCreateRequest:
      type: object
      required:
      - pickup_address
      - destination_address
      - vehicle_type
      properties:
        pickup_address:
          type: string
          example: Đại học Công nghiệp TP.HCM
        destination_address:
          type: string
          example: Sân bay Tân Sơn Nhất
        pickup_lat:
          type: number
          format: double
          example: 10.8557
        pickup_lng:
          type: number
          format: double
          example: 106.764
        destination_lat:
          type: number
          format: double
          example: 10.8188
        destination_lng:
          type: number
          format: double
          example: 106.6519
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
    Booking:
      type: object
      properties:
        id:
          type: integer
          example: 10001
        customer_id:
          type: integer
          example: 1
        driver_id:
          type: integer
          nullable: true
          example: 101
        pickup_address:
          type: string
        destination_address:
          type: string
        pickup_lat:
          type: number
          nullable: true
        pickup_lng:
          type: number
          nullable: true
        destination_lat:
          type: number
          nullable: true
        destination_lng:
          type: number
          nullable: true
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        status:
          $ref: '#/components/schemas/TripStatus'
        fare:
          type: number
          nullable: true
          example: 85000
        created_at:
          type: string
          format: date-time
    TripStatus:
      type: string
      enum:
      - booking
      - searching_driver
      - driver_assigned
      - arriving_pickup
      - arrived_pickup
      - picked_up
      - in_progress
      - completed
      - cancelled
    TripStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/TripStatus'
    TripTracking:
      type: object
      properties:
        booking_id:
          type: integer
          example: 10001
        status:
          $ref: '#/components/schemas/TripStatus'
        driver:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Driver'
        location:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Location'
        eta_minutes:
          type: integer
          nullable: true
          example: 8
    Location:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 10.8557
        longitude:
          type: number
          format: double
          example: 106.764
        updated_at:
          type: string
          format: date-time
    LocationRequest:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          example: 10.8557
        longitude:
          type: number
          format: double
          example: 106.764
    Fare:
      type: object
      properties:
        booking_id:
          type: integer
          example: 10001
        amount:
          type: number
          example: 85000
        currency:
          type: string
          example: VND
    PaymentRequest:
      type: object
      required:
      - booking_id
      - payment_method
      properties:
        booking_id:
          type: integer
          example: 10001
        payment_method:
          type: string
          enum:
          - cash
          - electronic
          example: electronic
    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 50001
        booking_id:
          type: integer
          example: 10001
        amount:
          type: number
          example: 85000
        payment_method:
          type: string
          enum:
          - cash
          - electronic
        status:
          type: string
          enum:
          - pending
          - paid
          - failed
          example: paid
        transaction_code:
          type: string
          nullable: true
          example: TXN1750000000000
        created_at:
          type: string
          format: date-time
    PaymentCallback:
      type: object
      required:
      - payment_id
      - status
      properties:
        payment_id:
          type: integer
          example: 50001
        status:
          type: string
          enum:
          - paid
          - failed
          example: paid
        transaction_code:
          type: string
          example: TXN123456
    NotificationRequest:
      type: object
      required:
      - recipient_id
      - event
      - message
      properties:
        recipient_id:
          type: integer
          example: 1
        event:
          type: string
          example: driver_assigned
        message:
          type: string
          example: Tài xế Trần Văn B đã nhận chuyến của bạn.
        channel:
          type: string
          enum:
          - push
          - sms
          - email
          default: push
    Notification:
      type: object
      properties:
        id:
          type: integer
          example: 80001
        recipient_id:
          type: integer
        event:
          type: string
        message:
          type: string
        channel:
          type: string
        status:
          type: string
          enum:
          - sent
          - failed
        created_at:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      required:
      - booking_id
      - rating
      properties:
        booking_id:
          type: integer
          example: 10001
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: Tài xế phục vụ tốt.
    Review:
      allOf:
      - $ref: '#/components/schemas/ReviewRequest'
      - type: object
        properties:
          id:
            type: integer
            example: 90001
          customer_id:
            type: integer
            example: 1
          driver_id:
            type: integer
            example: 101
          created_at:
            type: string
            format: date-time
    IncidentRequest:
      type: object
      required:
      - type
      - description
      properties:
        type:
          type: string
          example: driver_no_response
        description:
          type: string
          example: Tài xế không phản hồi yêu cầu chuyến.
    IncidentUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - open
          - processing
          - resolved
        result:
          type: string
          example: Đã phân công tài xế khác.
    Incident:
      allOf:
      - $ref: '#/components/schemas/IncidentRequest'
      - type: object
        properties:
          id:
            type: integer
            example: 70001
          booking_id:
            type: integer
            example: 10001
          status:
            type: string
            enum:
            - open
            - processing
            - resolved
          created_by:
            type: integer
            example: 900
          created_at:
            type: string
            format: date-time
    ReportSummary:
      type: object
      properties:
        total_trips:
          type: integer
          example: 1200
        completed_trips:
          type: integer
          example: 1080
        cancelled_trips:
          type: integer
          example: 120
        completion_rate:
          type: number
          example: 90
        cancellation_rate:
          type: number
          example: 10
        total_revenue:
          type: number
          example: 102000000
        currency:
          type: string
          example: VND
    TripReport:
      type: object
      properties:
        total_trips:
          type: integer
        completed_trips:
          type: integer
        cancelled_trips:
          type: integer
        completion_rate:
          type: number
        cancellation_rate:
          type: number
    RevenueReport:
      type: object
      properties:
        total_revenue:
          type: number
          example: 102000000
        currency:
          type: string
          example: VND
